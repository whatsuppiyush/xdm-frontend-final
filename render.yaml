services:
  - type: web
    name: xdm-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_URL
        sync: false # User needs to add their MongoDB URL
      - key: NEXTAUTH_URL
        sync: false # User needs to add their deployment URL
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false # User needs to add their Google OAuth client ID
      - key: GOOGLE_CLIENT_SECRET
        sync: false # User needs to add their Google OAuth client secret
      - key: UPSTASH_REDIS_REST_URL
        sync: false # User needs to add their Upstash Redis URL
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false # User needs to add their Upstash Redis token
      - key: OPENAI_API_KEY
        sync: false # User needs to add their OpenAI API key
      - key: RESEND_API_KEY
        sync: false # User needs to add their Resend API key 