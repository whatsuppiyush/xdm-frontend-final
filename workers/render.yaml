services:
  - type: web
    name: xautodm-background-worker
    env: node
    buildCommand: yarn install && npx prisma generate
    startCommand: yarn start:prod
    healthCheckPath: /health
    autoDeploy: true
    scaling:
      minInstances: 3
      maxInstances: 15
      targetMemoryPercent: 80
      targetCPUPercent: 80
      scalingRules:
        - ruleType: queue_length
          metric: waiting
          operator: greater_than
          value: 50
          cooldownPeriod: 300
        - ruleType: processing_rate
          metric: processingRate
          operator: less_than
          value: 20
          cooldownPeriod: 300
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: DB_URL
        sync: false
      - key: PORT
        value: 3000
      - key: MAX_CONCURRENT_CAMPAIGNS
        value: "10"
      - key: MESSAGES_PER_CAMPAIGN
        value: "400"
      - key: NODE_VERSION
        value: 20 